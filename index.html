<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монитор статусов Pro + Академия</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
 
        * { margin: 0; padding: 0; box-sizing: border-box; }
 
        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background: #09090b;
            color: #fafafa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
 
        /* ===== ЭКРАН ВХОДА ===== */
        #loginScreen {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 24px;
        }
 
        .login-card {
            background: #141417;
            border: 1px solid #27272a;
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
 
        .login-badge {
            display: inline-flex;
            background: #27272a;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            color: #a1a1aa;
            margin-bottom: 24px;
        }
 
        .login-title {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }
 
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            background: #ffffff;
            color: #09090b;
            border: none;
            border-radius: 16px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
 
        .btn-google:hover { background: #f4f4f5; transform: translateY(-1px); }
        .btn-google:active { transform: translateY(1px); }
        .btn-google:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-google svg { width: 20px; height: 20px; }
 
        /* ===== ЦЕНТРАЛЬНЫЙ ВЕРТИКАЛЬНЫЙ ХАБ ===== */
        #appScreen {
            display: none;
            width: 100%;
            max-width: 680px;
            padding: 40px 24px;
        }
 
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }
 
        .brand h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
        .brand p { font-size: 13px; color: #71717a; margin-top: 2px; }
 
        .user-widget {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #141417;
            padding: 6px 6px 6px 14px;
            border-radius: 50px;
            border: 1px solid #27272a;
        }
 
        .user-name { font-size: 14px; font-weight: 600; color: #e4e4e7; }
 
        .btn-logout {
            background: #27272a;
            border: none;
            color: #f4f4f5;
            padding: 8px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .btn-logout:hover { background: #dc2626; color: white; }
 
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            overflow: hidden;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
 
        /* Блок смены статуса */
        .status-panel {
            background: #141417;
            border: 1px solid #27272a;
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
        }
 
        .panel-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #71717a;
            margin-bottom: 16px;
        }
 
        .status-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: #09090b;
            padding: 6px;
            border-radius: 16px;
            border: 1px solid #27272a;
            margin-bottom: 16px;
        }
 
        .status-opt {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 12px 8px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #a1a1aa;
            transition: all 0.2s ease;
        }
 
        .status-opt:hover { color: #ffffff; background: #141417; }
 
        .status-opt[data-status="online"].selected  { background: #15803d; color: #ffffff; }
        .status-opt[data-status="away"].selected    { background: #b45309; color: #ffffff; }
        .status-opt[data-status="busy"].selected    { background: #b91c1c; color: #ffffff; }
        .status-opt[data-status="offline"].selected { background: #27272a; color: #ffffff; }
 
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot-online  { background: #22c55e; }
        .dot-away    { background: #f59e0b; }
        .dot-busy    { background: #ef4444; }
        .dot-offline { background: #71717a; }
 
        .btn-update {
            width: 100%;
            padding: 14px;
            background: #fafafa;
            color: #09090b;
            border: none;
            border-radius: 14px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-update:hover { background: #e4e4e7; }
        .btn-update:disabled { background: #27272a; color: #71717a; cursor: not-allowed; }
 
        /* Блок статистики (Новый) */
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #141417;
            border: 1px solid #27272a;
            border-radius: 16px;
            padding: 16px;
        }
        .stat-val { font-size: 20px; font-weight: 700; color: #fff; margin-top: 4px;}
        .stat-val.online-count { color: #22c55e; }
 
        /* Блок команды */
        .team-panel {
            background: #141417;
            border: 1px solid #27272a;
            border-radius: 24px;
            padding: 24px;
        }
 
        .panel-header-inline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
 
        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            color: #22c55e;
            text-transform: uppercase;
            background: rgba(34, 197, 94, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
        }
        .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; animation: blink 2s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
 
        .user-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }
 
        .user-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: #09090b;
            border: 1px solid #18181b;
            border-radius: 16px;
        }
 
        .user-item.me { border-color: #3b82f6; background: rgba(59, 130, 246, 0.03); }
 
        .user-meta { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1; }
        .user-info-text { display: flex; flex-direction: column; min-width: 0; }
        .user-display-name { font-size: 14px; font-weight: 600; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-display-name.me-tag { color: #3b82f6; }
        
        /* Время в учебе под именем */
        .user-study-time { font-size: 12px; color: #a1a1aa; margin-top: 2px; }
 
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            background: #141417;
            border: 1px solid #27272a;
            color: #e4e4e7;
        }
 
        .empty-state { text-align: center; color: #71717a; padding: 40px; font-size: 14px; }
        .user-list::-webkit-scrollbar { width: 4px; }
        .user-list::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
    </style>
</head>
<body>
 
<div id="loginScreen">
    <div class="login-card">
        <div class="login-badge">Supabase Realtime</div>
        <div class="login-title">Монитор статусов</div>
        <p style="color: #71717a; font-size: 14px; margin-bottom: 32px;">Синхронизация присутствия команды в реальном времени</p>
 
        <button class="btn-google" id="loginBtn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Войти через Google
        </button>
    </div>
</div>
 
<div id="appScreen">
    <div class="app-header">
        <div class="brand">
            <h1>Workspace</h1>
            <p>Панель присутствия</p>
        </div>
        <div class="user-widget">
            <span class="user-name" id="myName">…</span>
            <div class="avatar" id="myAvatar">?</div>
            <button class="btn-logout" id="logoutBtn">Выйти</button>
        </div>
    </div>

    <div class="stats-row">
        <div class="stat-card">
            <div class="panel-label" style="margin:0;">Сейчас онлайн</div>
            <div class="stat-val online-count" id="onlineCounter">0 чел.</div>
        </div>
        <div class="stat-card">
            <div class="panel-label" style="margin:0;">Моё время в учебе</div>
            <div class="stat-val" id="myStudyTimer">00:00:00</div>
        </div>
    </div>
 
    <div class="status-panel">
        <div class="panel-label">Мой текущий статус</div>
        <div class="status-selector">
            <div class="status-opt selected" data-status="online">
                <span class="dot dot-online"></span>
                <span>Онлайн</span>
            </div>
            <div class="status-opt" data-status="away">
                <span class="dot dot-away"></span>
                <span>Отошёл</span>
            </div>
            <div class="status-opt" data-status="busy">
                <span class="dot dot-busy"></span>
                <span>Занят</span>
            </div>
            <div class="status-opt" data-status="offline">
                <span class="dot dot-offline"></span>
                <span>Офлайн</span>
            </div>
        </div>
        <button class="btn-update" id="updateBtn">Обновить статус в системе</button>
    </div>
 
    <div class="team-panel">
        <div class="panel-header-inline">
            <div class="panel-label" style="margin-bottom:0;">Команда</div>
            <span class="live-indicator"><span class="live-dot"></span>Realtime поток</span>
        </div>
        <div class="user-list" id="userList">
            <div class="empty-state">Загрузка данных из Supabase…</div>
        </div>
    </div>
</div>
 
<script>
    if (typeof window.supabaseClientInitialized === 'undefined') {
        window.supabaseClientInitialized = true;
 
        const SUPABASE_URL = "https://zkgaabzztwrzktxezcoa.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InprZ2FhYnp6dHdyemt0eGV6Y29hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNzYzNzAsImV4cCI6MjA5Mjg1MjM3MH0.Yy8wA9X-M-fyff92Jlam-NJFFypHZtKrC0mYDNwqGKs";
 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
 
        let currentUser = null;
        let selectedStatus = "online";
        let realtimeChannel = null;
        let localUsersData = []; // Хранилище для динамического обновления таймеров
        let globalTimerInterval = null;
 
        const loginScreen = document.getElementById("loginScreen");
        const appScreen   = document.getElementById("appScreen");
        const loginBtn    = document.getElementById("loginBtn");
        const logoutBtn   = document.getElementById("logoutBtn");
        const updateBtn   = document.getElementById("updateBtn");
        const userList    = document.getElementById("userList");
        const myAvatar    = document.getElementById("myAvatar");
        const myName      = document.getElementById("myName");
        const onlineCounter = document.getElementById("onlineCounter");
        const myStudyTimer  = document.getElementById("myStudyTimer");
 
        const STATUS_META = {
            online:  { label: "Онлайн",  cls: "dot-online"  },
            away:    { label: "Отошёл",  cls: "dot-away"    },
            busy:    { label: "Занят",   cls: "dot-busy"    },
            offline: { label: "Офлайн",  cls: "dot-offline" },
        };
 
        function initials(name) {
            if (!name) return "?";
            return name.split(" ").map(w => w[0]).join("").slice(0,2).toUpperCase();
        }
 
        function escapeHtml(s) {
            return (s || "").replace(/[&<>]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
        }

        // Превращает секунды в формат ЧЧ:ММ:СС
        function formatSeconds(totalSeconds) {
            if (totalSeconds < 0 || isNaN(totalSeconds)) totalSeconds = 0;
            const hrs = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
            const mins = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
            const secs = Math.floor(totalSeconds % 60).toString().padStart(2, '0');
            return `${hrs}:${mins}:${secs}`;
        }
 
        // Логика авторизации Google
        loginBtn.addEventListener("click", async () => {
            loginBtn.textContent = "Перенаправление…";
            loginBtn.disabled = true;
            try {
                const { error } = await supabase.auth.signInWithOAuth({
                    provider: "google",
                    options: { redirectTo: window.location.href }
                });
                if (error) throw error;
            } catch (err) {
                alert("Ошибка OAuth: " + (err.message || err));
                loginBtn.textContent = "Войти через Google";
                loginBtn.disabled = false;
            }
        });
 
        logoutBtn.addEventListener("click", async () => {
            if (currentUser) {
                await syncStudyTimeBeforeStatusChange("offline");
            }
            await supabase.auth.signOut();
            clearInterval(globalTimerInterval);
            showLogin();
        });
 
        // Логика переключения кнопок (Сегментированный UI)
        document.querySelectorAll(".status-opt").forEach(el => {
            el.addEventListener("click", () => {
                document.querySelectorAll(".status-opt").forEach(e => e.classList.remove("selected"));
                el.classList.add("selected");
                selectedStatus = el.dataset.status;
            });
        });
 
        // Хелпер: фиксирует накопленное время перед тем, как сменить статус
        async function syncStudyTimeBeforeStatusChange(newStatus) {
            if (!currentUser) return;
            
            // Запрашиваем текущие данные из базы
            const { data: currentProfile } = await supabase
                .from("profiles")
                .select("status, study_duration, last_online_at")
                .eq("id", currentUser.id)
                .single();

            if (!currentProfile) return;

            let additionalSeconds = 0;
            // Если старый статус был "online", считаем сколько накапало с момента last_online_at
            if (currentProfile.status === "online" && currentProfile.last_online_at) {
                const lastOnline = new Date(currentProfile.last_online_at).getTime();
                const now = Date.now();
                if (now > lastOnline) {
                    additionalSeconds = Math.floor((now - lastOnline) / 1000);
                }
            }

            const newDuration = (currentProfile.study_duration || 0) + additionalSeconds;
            const updatedFields = { 
                status: newStatus,
                study_duration: newDuration,
                last_online_at: newStatus === "online" ? new Date().toISOString() : null
            };

            await supabase.from("profiles").update(updatedFields).eq("id", currentUser.id);
        }

        // Запись нового значения статуса в Supabase
        updateBtn.addEventListener("click", async () => {
            if (!currentUser) return;
            updateBtn.disabled = true;
            updateBtn.textContent = "Синхронизация…";
 
            await syncStudyTimeBeforeStatusChange(selectedStatus);
 
            updateBtn.disabled = false;
            updateBtn.textContent = "Обновить статус в системе";
            await refreshUsers();
        });
 
        function renderUsers() {
            if (!localUsersData || localUsersData.length === 0) {
                userList.innerHTML = '<div class="empty-state">Участники не найдены.</div>';
                onlineCounter.textContent = "0 чел.";
                return;
            }
 
            // Считаем сколько людей сейчас со статусом "online"
            const onlineCount = localUsersData.filter(u => u.status === 'online').length;
            onlineCounter.textContent = `${onlineCount} чел.`;

            userList.innerHTML = localUsersData.map(u => {
                const isMe = currentUser && u.id === currentUser.id;
                const st = STATUS_META[u.status] || STATUS_META["offline"];
                const name = escapeHtml(u.username || u.email || "Без имени");
                const av = u.avatar_url
                    ? `<img src="${escapeHtml(u.avatar_url)}" alt="">`
                    : initials(u.username || u.email);
 
                // Вычисляем общее время с учетом тикающего онлайна прямо сейчас
                let totalSec = u.study_duration || 0;
                if (u.status === 'online' && u.last_online_at) {
                    const diff = Math.floor((Date.now() - new Date(u.last_online_at).getTime()) / 1000);
                    if (diff > 0) totalSec += diff;
                }

                return `
                    <div class="user-item${isMe ? " me" : ""}">
                        <div class="user-meta">
                            <div class="avatar">${av}</div>
                            <div class="user-info-text">
                                <div class="user-display-name${isMe ? " me-tag" : ""}">${name}${isMe ? " (Вы)" : ""}</div>
                                <div class="user-study-time" id="timer-${u.id}">В учебе: ${formatSeconds(totalSec)}</div>
                            </div>
                        </div>
                        <div class="status-badge">
                            <span class="dot ${st.cls}"></span>
                            <span>${st.label}</span>
                        </div>
                    </div>
                `;
            }).join("");
        }
 
        async function refreshUsers() {
            const { data, error } = await supabase
                .from("profiles")
                .select("id, username, email, status, avatar_url, study_duration, last_online_at")
                .order("username", { ascending: true });
 
            if (error) {
                userList.innerHTML = `<div class="empty-state" style="color:#ef4444">Ошибка: ${error.message}</div>`;
                return;
            }
            
            localUsersData = data || [];
            renderUsers();
 
            // Синхронизируем переключатель интерфейса для текущего юзера
            if (currentUser) {
                const me = localUsersData.find(u => u.id === currentUser.id);
                if (me && me.status) {
                    document.querySelectorAll(".status-opt").forEach(el => {
                        el.classList.toggle("selected", el.dataset.status === me.status);
                    });
                    selectedStatus = me.status;
                }
            }
        }
 
        // Каждую секунду обновляем таймеры на клиенте без лишних запросов к БД
        function startLocalTimers() {
            if (globalTimerInterval) clearInterval(globalTimerInterval);
            
            globalTimerInterval = setInterval(() => {
                localUsersData.forEach(u => {
                    let totalSec = u.study_duration || 0;
                    if (u.status === 'online' && u.last_online_at) {
                        const diff = Math.floor((Date.now() - new Date(u.last_online_at).getTime()) / 1000);
                        if (diff > 0) totalSec += diff;
                    }
                    
                    // Обновляем таймер в списке
                    const timerEl = document.getElementById(`timer-${u.id}`);
                    if (timerEl) {
                        timerEl.textContent = `В учебе: ${formatSeconds(totalSec)}`;
                    }

                    // Если это я, обновляем мою главную плашку сверху
                    if (currentUser && u.id === currentUser.id) {
                        myStudyTimer.textContent = formatSeconds(totalSec);
                    }
                });
            }, 1000);
        }

        async function setupRealtime() {
            if (realtimeChannel) await realtimeChannel.unsubscribe();
            realtimeChannel = supabase
                .channel("profiles-realtime")
                .on("postgres_changes", { event: "*", schema: "public", table: "profiles" }, () => {
                    refreshUsers();
                })
                .subscribe();
        }
 
        function showLogin() {
            loginScreen.style.display = "flex";
            appScreen.style.display = "none";
            currentUser = null;
        }
 
        async function showApp(user) {
            currentUser = user;
            loginScreen.style.display = "none";
            appScreen.style.display = "block";
 
            const meta = user.user_metadata || {};
            const name = meta.full_name || meta.name || user.email || "Пользователь";
            myName.textContent = name.split(" ")[0];
 
            if (meta.avatar_url || meta.picture) {
                myAvatar.innerHTML = `<img src="${meta.avatar_url || meta.picture}" alt="">`;
            } else {
                myAvatar.textContent = initials(name);
            }
 
            const { data: profile } = await supabase
                .from("profiles")
                .select("status")
                .eq("id", user.id)
                .single();
 
            if (!profile) {
                // Инициализируем запись для нового пользователя
                await supabase.from("profiles").insert({
                    id: user.id,
                    username: name,
                    email: user.email,
                    avatar_url: meta.avatar_url || meta.picture || null,
                    status: "online",
                    study_duration: 0,
                    last_online_at: new Date().toISOString()
                });
            } else if (profile.status === "online") {
                // Если зашли заново, а статус оставался online — обновляем штамп входа
                await supabase.from("profiles").update({
                    last_online_at: new Date().toISOString()
                }).eq("id", user.id);
            }
 
            await refreshUsers();
            await setupRealtime();
            startLocalTimers();
        }
 
        supabase.auth.onAuthStateChange(async (event, session) => {
            if (session && session.user) {
                await showApp(session.user);
            } else {
                showLogin();
            }
        });
    }
</script>
</body>
</html>
