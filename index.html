<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монитор статусов Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
 
        * { margin: 0; padding: 0; box-sizing: border-box; }
 
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
 
        /* ===== СВЕТЛЫЙ ЭКРАН ВХОДА ===== */
        #loginScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
 
        .login-box {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.05);
        }
 
        .login-logo {
            font-size: 42px;
            margin-bottom: 16px;
            display: inline-block;
            background: #ffffff;
            padding: 12px;
            border-radius: 18px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.03);
        }
 
        .login-title {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }
 
        .login-sub {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 32px;
            line-height: 1.6;
        }
 
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px 20px;
            background: #0f172a;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
        }
 
        .btn-google:hover { background: #1e293b; transform: translateY(-1px); }
        .btn-google:active { transform: translateY(1px); }
        .btn-google:disabled { opacity: 0.5; cursor: not-allowed; }
 
        .btn-google svg { width: 18px; height: 18px; flex-shrink: 0; }
 
        .login-note {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 24px;
        }
 
        /* ===== СВЕТЛОЕ ПРИЛОЖЕНИЕ ===== */
        #appScreen {
            display: none;
            max-width: 1050px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 24px;
        }
 
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 36px;
            flex-wrap: wrap;
            gap: 16px;
        }
 
        .header-left h1 {
            font-size: 26px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.02em;
        }
 
        .header-left p {
            font-size: 14px;
            color: #64748b;
            margin-top: 4px;
        }
 
        .user-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 50px;
            padding: 6px 16px 6px 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
 
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #6366f1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: white;
            overflow: hidden;
        }
 
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
 
        .user-pill-name {
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }
 
        .btn-logout {
            background: #f1f5f9;
            border: none;
            color: #64748b;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 30px;
            font-family: inherit;
            transition: all 0.15s;
        }
 
        .btn-logout:hover { color: #ef4444; background: #fee2e2; }
 
        .grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 24px;
        }
 
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
 
        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.02);
            height: fit-content;
        }
 
        .card-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            margin-bottom: 24px;
        }
 
        /* Сетка статусов (Кнопки стали крупнее и приятнее) */
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
 
        .status-opt {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            background: #f8fafc;
            transition: all 0.2s ease;
            font-size: 14px;
            font-weight: 500;
            color: #475569;
        }
 
        .status-opt:hover { border-color: #cbd5e1; background: #f1f5f9; color: #0f172a; }
 
        .status-opt.selected {
            border-color: #6366f1;
            background: #e0e7ff;
            color: #4338ca;
            font-weight: 600;
        }
 
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
 
        .dot-online  { background: #10b981; box-shadow: 0 0 0 4px #d1fae5; }
        .dot-away    { background: #f59e0b; box-shadow: 0 0 0 4px #fef3c7; }
        .dot-busy    { background: #ef4444; box-shadow: 0 0 0 4px #fee2e2; }
        .dot-offline { background: #94a3b8; box-shadow: 0 0 0 4px #f1f5f9; }
 
        .btn-update {
            width: 100%;
            padding: 14px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 16px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }
 
        .btn-update:hover { background: #4f46e5; box-shadow: 0 6px 16px rgba(99, 102, 241, 0.3); }
        .btn-update:active { transform: scale(0.99); }
        .btn-update:disabled { background: #cbd5e1; color: #94a3b8; cursor: not-allowed; box-shadow: none; }
 
        /* Список участников */
        .user-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 480px;
            overflow-y: auto;
            padding-right: 4px;
        }
 
        .user-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            transition: all 0.2s ease;
        }
 
        .user-item.me {
            border-color: #c7d2fe;
            background: #f5f7ff;
        }
 
        .user-av {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            flex-shrink: 0;
            overflow: hidden;
            border: 2px solid #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
 
        .user-av img { width: 100%; height: 100%; object-fit: cover; }
 
        .user-info { flex: 1; min-width: 0; }
 
        .user-name {
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
 
        .user-name-me { color: #4338ca; }
 
        .status-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }
 
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #10b981;
            text-transform: none;
            letter-spacing: normal;
            background: #d1fae5;
            padding: 4px 10px;
            border-radius: 20px;
        }
 
        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }
 
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
        }
 
        .empty-state {
            padding: 40px;
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
        }
 
        /* Красивый тонкий скроллбар */
        .user-list::-webkit-scrollbar { width: 5px; }
        .user-list::-webkit-scrollbar-track { background: transparent; }
        .user-list::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .user-list::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
    </style>
</head>
<body>
 
<div id="loginScreen">
    <div class="login-box">
        <div class="login-logo">📊</div>
        <div class="login-title">Монитор статусов</div>
        <div class="login-sub">Войдите, чтобы видеть и менять<br>статус в реальном времени</div>
 
        <button class="btn-google" id="loginBtn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Войти через Google
        </button>
 
        <div class="login-note">Авторизация защищена через Supabase Auth</div>
    </div>
</div>
 
<div id="appScreen">
    <div class="header">
        <div class="header-left">
            <h1>Монитор статусов</h1>
            <p>Живая синхронизация · Supabase Realtime</p>
        </div>
        <div class="user-pill">
            <div class="avatar" id="myAvatar">?</div>
            <span class="user-pill-name" id="myName">…</span>
            <button class="btn-logout" id="logoutBtn">Выйти</button>
        </div>
    </div>
 
    <div class="grid">
        <div class="card">
            <div class="card-title">Мой статус</div>
 
            <div class="status-grid">
                <div class="status-opt selected" data-status="online">
                    <span class="dot dot-online"></span> Онлайн
                </div>
                <div class="status-opt" data-status="away">
                    <span class="dot dot-away"></span> Отошёл
                </div>
                <div class="status-opt" data-status="busy">
                    <span class="dot dot-busy"></span> Занят
                </div>
                <div class="status-opt" data-status="offline">
                    <span class="dot dot-offline"></span> Офлайн
                </div>
            </div>
 
            <button class="btn-update" id="updateBtn">Обновить статус</button>
        </div>
 
        <div class="card">
            <div class="card-title">
                Участники
                <span class="live-badge">
                    <span class="live-dot"></span>realtime
                </span>
            </div>
            <div class="user-list" id="userList">
                <div class="empty-state">Загрузка данных…</div>
            </div>
        </div>
    </div>
</div>
 
<script>
    document.addEventListener("DOMContentLoaded", () => {
        // ===================== НАСТРОЙКИ SUPABASE =====================
        const SUPABASE_URL = "https://zkgaabzztwrzktxezcoa.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InprZ2FhYnp6dHdyemt0eGV6Y29hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNzYzNzAsImV4cCI6MjA5Mjg1MjM3MH0.Yy8wA9X-M-fyff92Jlam-NJFFypHZtKrC0mYDNwqGKs";
        // =================================================================
 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
 
        let currentUser = null;
        let selectedStatus = "online";
        let realtimeChannel = null;
        let usersState = []; 
 
        const loginScreen = document.getElementById("loginScreen");
        const appScreen   = document.getElementById("appScreen");
        const loginBtn    = document.getElementById("loginBtn");
        const logoutBtn   = document.getElementById("logoutBtn");
        const updateBtn   = document.getElementById("updateBtn");
        const userList    = document.getElementById("userList");
        const myAvatar    = document.getElementById("myAvatar");
        const myName      = document.getElementById("myName");
 
        const STATUS_META = {
            online:  { label: "Онлайн",  cls: "dot-online"  },
            away:    { label: "Отошёл",  cls: "dot-away"    },
            busy:    { label: "Занят",   cls: "dot-busy"    },
            offline: { label: "Офлайн",  cls: "dot-offline" },
        };
 
        function initials(name) {
            if (!name) return "?";
            return name.split(" ").map(w => w[0]).join("").slice(0,2).toUpperCase();
        }
 
        function escapeHtml(s) {
            return (s || "").replace(/[&<>]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
        }
 
        function showLogin() {
            loginScreen.style.display = "flex";
            appScreen.style.display = "none";
            loginBtn.textContent = "Войти через Google";
            loginBtn.disabled = false;
            currentUser = null;
            if (realtimeChannel) {
                realtimeChannel.unsubscribe();
                realtimeChannel = null;
            }
        }
 
        loginBtn.addEventListener("click", async () => {
            loginBtn.textContent = "Перенаправление…";
            loginBtn.disabled = true;
            
            const { error } = await supabase.auth.signInWithOAuth({
                provider: "google",
                options: { redirectTo: window.location.href }
            });
 
            if (error) {
                alert("Ошибка OAuth: " + error.message);
                loginBtn.textContent = "Войти через Google";
                loginBtn.disabled = false;
            }
        });
 
        logoutBtn.addEventListener("click", async () => {
            if (currentUser) {
                await supabase.from("profiles").update({ status: "offline" }).eq("id", currentUser.id);
            }
            await supabase.auth.signOut();
            showLogin();
        });
 
        document.querySelectorAll(".status-opt").forEach(el => {
            el.addEventListener("click", () => {
                document.querySelectorAll(".status-opt").forEach(e => e.classList.remove("selected"));
                el.classList.add("selected");
                selectedStatus = el.dataset.status;
            });
        });
 
        updateBtn.addEventListener("click", async () => {
            if (!currentUser) return;
            updateBtn.disabled = true;
            updateBtn.textContent = "Сохранение…";
 
            const { error } = await supabase
                .from("profiles")
                .update({ status: selectedStatus })
                .eq("id", currentUser.id);
 
            if (error) alert("Не удалось обновить статус: " + error.message);
 
            updateBtn.disabled = false;
            updateBtn.textContent = "Обновить статус";
        });
 
        function renderUsers() {
            if (usersState.length === 0) {
                userList.innerHTML = '<div class="empty-state">Нет участников.</div>';
                return;
            }
 
            userList.innerHTML = usersState.map(u => {
                const isMe = currentUser && u.id === currentUser.id;
                const st = STATUS_META[u.status] || STATUS_META["offline"];
                const name = escapeHtml(u.username || u.email || "Без имени");
                const av = u.avatar_url
                    ? `<img src="${escapeHtml(u.avatar_url)}" referrerpolicy="no-referrer" alt="">`
                    : initials(u.username || u.email);
 
                return `
                    <div class="user-item${isMe ? " me" : ""}" id="u-${u.id}">
                        <div class="user-av">${av}</div>
                        <div class="user-info">
                            <div class="user-name${isMe ? " user-name-me" : ""}">${name}${isMe ? " · Вы" : ""}</div>
                            <div class="status-label">
                                <span class="dot ${st.cls}"></span>
                                ${st.label}
                            </div>
                        </div>
                    </div>
                `;
            }).join("");
        }
 
        async function fetchInitialUsers() {
            const { data, error } = await supabase
                .from("profiles")
                .select("id, username, email, status, avatar_url")
                .order("username", { ascending: true });
 
            if (error) {
                userList.innerHTML = `<div class="empty-state" style="color:#ef4444">Ошибка: ${error.message}</div>`;
                return;
            }
 
            usersState = data || [];
            renderUsers();
 
            if (currentUser) {
                const me = usersState.find(u => u.id === currentUser.id);
                if (me && me.status) {
                    document.querySelectorAll(".status-opt").forEach(el => {
                        el.classList.toggle("selected", el.dataset.status === me.status);
                    });
                    selectedStatus = me.status;
                }
            }
        }
 
        function setupRealtime() {
            if (realtimeChannel) realtimeChannel.unsubscribe();
 
            realtimeChannel = supabase
                .channel("profiles-changes")
                .on("postgres_changes", { event: "*", schema: "public", table: "profiles" }, (payload) => {
                    const { eventType, new: newRow, old: oldRow } = payload;
 
                    if (eventType === "INSERT") {
                        if (!usersState.some(u => u.id === newRow.id)) usersState.push(newRow);
                    } else if (eventType === "UPDATE") {
                        usersState = usersState.map(u => u.id === newRow.id ? { ...u, ...newRow } : u);
                    } else if (eventType === "DELETE") {
                        usersState = usersState.filter(u => u.id === oldRow.id);
                    }
                    
                    usersState.sort((a, b) => (a.username || "").localeCompare(b.username || ""));
                    renderUsers();
                })
                .subscribe();
        }
 
        async function showApp(user) {
            currentUser = user;
            loginScreen.style.display = "none";
            appScreen.style.display = "block";
 
            const meta = user.user_metadata || {};
            const name = meta.full_name || meta.name || user.email || "Пользователь";
            myName.textContent = name.split(" ")[0];
 
            if (meta.avatar_url || meta.picture) {
                myAvatar.innerHTML = `<img src="${meta.avatar_url || meta.picture}" referrerpolicy="no-referrer" alt="">`;
            } else {
                myAvatar.textContent = initials(name);
            }
 
            const { data: profile } = await supabase
                .from("profiles")
                .select("status")
                .eq("id", user.id)
                .single();
 
            if (!profile) {
                await supabase.from("profiles").insert({
                    id: user.id,
                    username: name,
                    email: user.email,
                    avatar_url: meta.avatar_url || meta.picture || null,
                    status: "online"
                });
            } else if (profile.status === "offline") {
                await supabase.from("profiles").update({ status: "online" }).eq("id", user.id);
            }
 
            await fetchInitialUsers();
            setupRealtime();
        }
 
        supabase.auth.onAuthStateChange((event, session) => {
            if (session?.user) {
                showApp(session.user);
            } else {
                showLogin();
            }
        });
    });
</script>
</body>
</html>
